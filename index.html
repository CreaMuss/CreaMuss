<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2014">
<title>CreaMus · Campeonatos de mus</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#10291B;--bg2:#0B2014;--card:#183A27;--card2:#1F4831;--line:#2C5840;
  --txt:#EEF5F0;--mute:#9DBBA8;--crema:#F6EDD5;--oro:#E7B94F;--oro2:#F3D488;--rojo:#E66B60;--azul:#8BBDF4;--verde:#7FD99C;
  --serif:'Alegreya',Georgia,serif;--sans:'Alegreya Sans','Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.4;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}
main{padding:14px 14px calc(130px + env(safe-area-inset-bottom,0px))}
.sin-nav main{padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0}
h2.sec{font-family:var(--serif);font-size:1.3rem;color:var(--crema);margin:24px 0 10px;display:flex;align-items:center;gap:8px}
.nota{color:var(--mute);font-size:.92rem;margin:6px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.pad{padding:14px}
.fila-flex{display:flex;align-items:center;gap:10px}
.oculto{display:none!important}

/* Cabeceras */
.top{background:linear-gradient(180deg,var(--bg2),var(--bg));padding:16px 14px 10px;position:relative;overflow:hidden}
.top::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;background-image:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 9px),repeating-linear-gradient(-45deg,#fff 0 1px,transparent 1px 9px)}
.top>*{position:relative;z-index:1}
.top-barra{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.icono-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:1.1rem;flex:0 0 auto}
.icono-btn.on{background:var(--oro);color:#1A1A10;border-color:var(--oro)}
.titulo{font-family:var(--serif);font-weight:800;font-size:1.7rem;line-height:1.08;color:var(--crema);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.chip.oro{background:rgba(231,185,79,.16);color:var(--oro2);border-color:rgba(231,185,79,.35)}
.hero{text-align:center;padding:26px 14px 18px}
.hero .logo{font-size:2.6rem}
.hero h1{font-family:var(--serif);font-weight:800;font-size:2rem;color:var(--crema);line-height:1.05;margin-top:6px}
.hero p{color:var(--mute);margin:8px auto 0;max-width:30ch}
.banner{background:rgba(139,189,244,.10);border:1px solid rgba(139,189,244,.3);color:#D6E6FA;border-radius:12px;padding:10px 12px;font-size:.88rem;margin-bottom:14px}
.banner b{color:#fff}

/* Botones */
.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:800;background:var(--oro);color:#1A1A10;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.full{width:100%}
.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn.peligro{background:transparent;color:var(--rojo);border:1px solid var(--rojo)}
.btn.peq{padding:8px 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acciones .btn{flex:1 1 auto}

/* Portal */
.camp{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.camp .ico{width:48px;height:48px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:1.5rem}
.camp h3{font-family:var(--serif);font-size:1.15rem;color:var(--crema);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camp .meta{display:block;color:var(--mute);font-size:.84rem;margin-top:2px}
.camp .barra{display:block;height:5px;background:var(--card2);border-radius:3px;margin-top:8px;overflow:hidden}
.camp .barra i{display:block;height:100%;background:var(--oro)}
.candado{font-size:1.2rem;opacity:.85}

/* Avatares y participantes */
.av{--h:120;width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-size:.72rem;font-weight:800;color:#0B2014;background:hsl(var(--h),55%,68%);border:2px solid var(--card);flex:0 0 auto;letter-spacing:.02em}
.av.g{width:44px;height:44px;font-size:.95rem}
.av.xl{width:64px;height:64px;font-size:1.3rem;border-width:3px}
.av.vacio{background:var(--card2);color:var(--mute)}
.avs{display:inline-flex;flex:0 0 auto}
.avs .av+.av{margin-left:-10px}
.pt{display:flex;align-items:center;gap:8px;min-width:0}
.pn{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.pn b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.95rem}
.pn small{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.78rem}
.pt.der{flex-direction:row-reverse;text-align:right}
.pt.der .avs{flex-direction:row-reverse}
.pt.der .avs .av+.av{margin-left:0;margin-right:-10px}
.pt.ph .pn b{color:var(--mute);font-weight:600;font-style:italic;white-space:normal;font-size:.85rem}
.pt.gana .pn b{color:var(--verde)}

/* Partidas */
.lista{display:flex;flex-direction:column;gap:8px}
.match{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:6px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 10px;text-align:left}
.match.mia{border-color:var(--oro);box-shadow:0 0 0 1px var(--oro) inset}
.match.bye{opacity:.6;cursor:default}
.centro{display:flex;flex-direction:column;align-items:center;gap:3px}
.centro .res{font-family:var(--serif);font-weight:800;font-size:1.35rem;color:var(--crema);line-height:1}
.centro .vs{font-weight:800;color:var(--mute);font-size:.85rem;border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.est{font-size:.68rem;font-weight:800;padding:1px 6px;border-radius:6px;white-space:nowrap}
.e-jugada{background:rgba(139,189,244,.16);color:var(--azul)}
.e-abierta{background:rgba(127,217,156,.16);color:var(--verde)}
.e-proxima{background:var(--card2);color:var(--mute)}
.e-tarde{background:rgba(230,107,96,.18);color:var(--rojo)}
.ronda{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 8px}
.ronda h3{font-family:var(--serif);font-size:1.12rem;color:var(--crema)}
.ronda span{color:var(--mute);font-size:.85rem}
.descanso{font-size:.85rem;color:var(--mute);display:flex;align-items:center;gap:8px;padding:2px 4px}

/* Filtros y segmentos */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:800;color:var(--mute);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--oro);color:#1A1A10}

/* Clasificación */
.tabla{display:flex;flex-direction:column;gap:6px}
.pos-row{display:grid;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;width:100%;text-align:left}
.pos-row.pasa{border-left:4px solid var(--oro)}
.pos-row.yo{background:rgba(231,185,79,.12)}
.pos-row.fuera{opacity:.55}
.pos{font-family:var(--serif);font-weight:800;font-size:1.25rem;text-align:center;color:var(--crema)}
.pos.p1{color:#F3D488}.pos.p2{color:#D9DEE3}.pos.p3{color:#E0A577}
.cifra{text-align:right;line-height:1}
.cifra b{font-family:var(--serif);font-size:1.5rem;color:var(--crema)}
.cifra small{display:block;color:var(--mute);font-size:.72rem;margin-top:2px}
.detalle{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.mini{background:var(--card2);border-radius:10px;padding:6px 4px;text-align:center}
.mini b{display:block;font-size:1rem}
.mini span{font-size:.7rem;color:var(--mute)}
.forma{display:flex;gap:3px}
.forma i{width:14px;height:14px;border-radius:50%;font-style:normal;font-size:.55rem;font-weight:800;display:grid;place-items:center;color:#0B2014}
.forma i.V{background:var(--verde)}.forma i.D{background:var(--rojo)}.forma i.N{background:var(--line)}
.grupo-cab{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-family:var(--serif);font-weight:800;font-size:1.15rem;color:var(--crema)}
.grupo-cab .letra{width:30px;height:30px;border-radius:9px;background:var(--oro);color:#1A1A10;display:grid;place-items:center;font-size:1rem}
.prom-bar{height:6px;background:var(--card2);border-radius:3px;margin-top:5px;overflow:hidden}
.prom-bar i{display:block;height:100%;background:var(--verde)}

/* Inicio */
.yo-card{background:linear-gradient(135deg,#1F4831,#183A27);border:1px solid var(--line);border-radius:18px;padding:14px}
.yo-card select{margin-top:8px}
.proxima{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:12px;background:rgba(0,0,0,.18);border-radius:14px;padding:12px;border:0;width:100%;text-align:left}
.proxima .lbl{font-size:.75rem;color:var(--oro2);font-weight:800}
.proxima b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proxima small{color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-family:var(--serif);font-size:1.45rem;line-height:1.1;color:var(--crema)}
.kpi span{color:var(--mute);font-size:.75rem;line-height:1.2;display:block}
.yo-card .kpis{margin-top:10px}
.yo-card .kpi{background:rgba(0,0,0,.18);border:0}
.podio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;margin-top:6px}
.podio .esc{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.podio .nom{font-weight:800;font-size:.82rem;text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.podio .bloque{width:100%;border-radius:12px 12px 4px 4px;display:grid;place-items:center;font-family:var(--serif);font-weight:800;font-size:1.5rem;color:#1A1A10}
.podio .b1{height:92px;background:linear-gradient(#F3D488,#C9962C)}
.podio .b2{height:70px;background:linear-gradient(#E5E9ED,#A9B2BA)}
.podio .b3{height:54px;background:linear-gradient(#EDB88E,#B07443)}
.podio .val{font-size:.75rem;color:var(--mute)}
.campeon{background:linear-gradient(135deg,#4A3A10,#7A5D18);border:1px solid var(--oro);border-radius:18px;padding:16px;text-align:center;margin-bottom:14px}
.campeon .copa{font-size:2.2rem}
.campeon b{display:block;font-family:var(--serif);font-size:1.5rem;color:#FFF3D6;line-height:1.1;margin-top:4px}
.campeon small{color:#F0DDAA}
.anillo{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--oro) calc(var(--p)*1%),var(--card2) 0);display:grid;place-items:center;flex:0 0 auto}
.anillo span{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:.9rem}

/* Comparador */
.vs-cab{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;text-align:center}
.vs-cab .lado{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vs-cab .lado b{font-size:.9rem;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vs-cab .vs-big{font-family:var(--serif);font-weight:800;font-size:1.4rem;color:var(--oro)}
.selects{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.duelo{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.duelo:first-child{border-top:0}
.duelo .v{font-weight:800;text-align:center;font-size:.95rem}
.duelo .v.mejor{color:var(--oro2)}
.duelo .medio{display:flex;flex-direction:column;gap:4px}
.duelo .lbl{text-align:center;font-size:.75rem;color:var(--mute);font-weight:700}
.barras2{display:grid;grid-template-columns:1fr 1fr;gap:3px;height:8px}
.barras2 .l{display:flex;justify-content:flex-end;background:var(--card2);border-radius:4px 0 0 4px;overflow:hidden}
.barras2 .r{background:var(--card2);border-radius:0 4px 4px 0;overflow:hidden}
.barras2 i{display:block;height:100%;background:var(--azul)}
.barras2 .r i{background:var(--oro)}
.h2h{display:flex;justify-content:center;align-items:center;gap:14px;font-family:var(--serif);font-weight:800;font-size:2rem;color:var(--crema);margin:6px 0}
.h2h small{font-family:var(--sans);font-size:.8rem;color:var(--mute);font-weight:700}
.rank{display:grid;grid-template-columns:22px minmax(0,1fr) 90px 44px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .n{color:var(--mute);font-weight:800;font-size:.85rem}
.rank .track{height:8px;background:var(--card2);border-radius:4px;overflow:hidden}
.rank .track i{display:block;height:100%;background:var(--verde)}
.rank .v{text-align:right;font-weight:800;font-size:.9rem}

/* Reglas */
.regla{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.regla .ri{width:42px;height:42px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:1.3rem}
.regla h3{font-size:1rem;margin-bottom:3px}
.regla p{margin:0;color:#CFE0D5;font-size:.92rem}
.regla .tag{font-size:.7rem;font-weight:800;color:var(--oro2)}
.regla-acc{display:flex;flex-direction:column;gap:4px}
.mini-btn{border:1px solid var(--line);background:var(--card2);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;font-size:.9rem}
.log{font-size:.82rem;color:var(--mute);padding:6px 0;border-top:1px solid var(--line)}
.log:first-child{border-top:0}

/* Barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,32,20,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:.7rem;font-weight:800}
.nav button span{font-size:1.25rem;line-height:1.2;filter:grayscale(.6);opacity:.8}
.nav button[aria-current="page"]{color:var(--oro2)}
.nav button[aria-current="page"] span{filter:none;opacity:1}
.fab{position:fixed;right:max(14px,calc(50% - 226px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:31;border:0;border-radius:30px;padding:13px 18px;background:var(--oro);color:#1A1A10;font-weight:800;box-shadow:0 10px 24px rgba(0,0,0,.45)}

/* Asistente */
.pasos{display:flex;gap:4px;margin:4px 0 8px}
.pasos i{flex:1;height:5px;border-radius:3px;background:var(--card2)}
.pasos i.ok{background:var(--oro)}
.paso-t{color:var(--mute);font-size:.82rem;font-weight:800}
.op{display:grid;grid-template-columns:52px minmax(0,1fr) 22px;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.op[aria-pressed="true"]{border-color:var(--oro);background:rgba(231,185,79,.08)}
.op:disabled{opacity:.35}
.op .oi{width:52px;height:52px;border-radius:14px;background:var(--card2);display:grid;place-items:center;font-size:1.6rem}
.op .oi svg{width:38px;height:38px}
.op b{display:block;font-size:1.05rem}
.op small{color:var(--mute);font-size:.86rem;display:block;margin-top:2px;line-height:1.3}
.op .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.75rem;font-weight:900;color:transparent}
.op[aria-pressed="true"] .check{background:var(--oro);border-color:var(--oro);color:#1A1A10}
.cuantos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cuantos button{min-width:52px;padding:10px 0;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:1.05rem}
.cuantos button[aria-pressed="true"]{border-color:var(--oro);background:var(--oro);color:#1A1A10}
.stepper{display:grid;grid-template-columns:52px minmax(0,1fr) 52px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.stepper button{height:52px;border:0;background:var(--card2);font-size:1.5rem;font-weight:800}
.stepper div{text-align:center}
.stepper div b{font-family:var(--serif);font-size:1.6rem;color:var(--crema);display:block;line-height:1}
.stepper div span{font-size:.78rem;color:var(--mute)}
.pareja-in{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.pareja-in .cab{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:800;font-size:.85rem;color:var(--mute)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:6px}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--bg2);width:100%;min-width:0}
input::placeholder,textarea::placeholder{color:#6F8C7B}
textarea{min-height:80px;resize:vertical}
label.lbl{display:block;font-weight:800;font-size:.88rem;margin:12px 0 6px}
.juegos-dots{display:flex;gap:4px;margin-top:6px}
.juegos-dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.juegos-dots i.w{background:var(--oro)}
.preview-grupos{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-top:10px}
.preview-grupos div{background:var(--card2);border-radius:10px;padding:8px 6px;text-align:center}
.preview-grupos b{display:block;color:var(--oro2);font-family:var(--serif)}
.preview-grupos span{font-size:.75rem;color:var(--mute)}
.resumen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.resumen div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.resumen span{display:block;font-size:.75rem;color:var(--mute);font-weight:700}
.resumen b{font-size:.95rem}
.pie-asist{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(11,32,20,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.pie-asist .in{max-width:452px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:8px}
.slug{font-size:.82rem;color:var(--mute);margin-top:6px;overflow-wrap:anywhere}
.slug b{color:var(--oro2)}
.exito{text-align:center;padding:20px 6px}
.exito .big{font-size:3rem}
.claves{display:grid;gap:8px;margin:14px 0;text-align:left}
.clave{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.clave span{color:var(--mute);font-size:.85rem}
.clave b{font-family:ui-monospace,Menlo,monospace;color:var(--oro2);font-size:1.05rem}

/* Candado */
.lock{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 10px}
.lock .ic{width:84px;height:84px;border-radius:24px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:2.4rem;margin-bottom:16px}
.lock h2{font-family:var(--serif);font-size:1.6rem;color:var(--crema)}
.lock form{width:100%;max-width:320px;margin-top:18px}
.lock input{text-align:center;font-size:1.3rem;letter-spacing:.2em;padding:14px}
.recordar{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--mute);font-size:.9rem;margin:12px 0}
.recordar input{width:auto}
.error{color:var(--rojo);font-weight:800;min-height:1.3em;margin:8px 0 0;font-size:.92rem}

/* Hoja inferior */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:480px;max-height:92vh;background:var(--card);color:var(--txt);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
dialog.sheet::backdrop{background:rgba(3,12,7,.7)}
.sheet-in{padding:10px 16px calc(32px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:92vh}
.asa{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3.st{font-family:var(--serif);font-size:1.3rem;color:var(--crema)}
.sheet .sub{color:var(--mute);font-size:.88rem;margin:2px 0 12px}
.marcador{background:var(--bg2);border-radius:16px;padding:12px;margin-bottom:10px}
.marcador .pt{margin-bottom:10px}
.juegos{display:flex;gap:8px}
.juegos button{flex:1;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-family:var(--serif);font-weight:800;font-size:1.3rem}
.juegos button[aria-pressed="true"]{background:var(--oro);border-color:var(--oro);color:#1A1A10}
.juegos button:disabled{opacity:.5}
.presentes{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.presentes button{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--card2);border-radius:24px;padding:4px 12px 4px 4px;font-weight:800;font-size:.88rem}
.presentes button[aria-pressed="false"]{opacity:.45;border-style:dashed}
.presentes button[aria-pressed="true"]{border-color:var(--verde)}
.mesa{background:var(--bg2);border-radius:14px;padding:10px;margin-bottom:8px}
.mesa .t{font-size:.75rem;font-weight:800;color:var(--oro2);margin-bottom:6px}
@media (prefers-reduced-motion:no-preference){
  dialog.sheet[open]{animation:sube .22s ease-out}
  @keyframes sube{from{transform:translateY(40px);opacity:.4}}
  .mesa.rev{animation:rev .4s ease-out both}
  @keyframes rev{from{transform:scale(.9);opacity:0}}
}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--crema);color:#1A1A10;font-weight:800;padding:10px 16px;border-radius:12px;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.vacio{text-align:center;border:1px dashed var(--line);border-radius:16px;padding:24px 14px;color:var(--mute)}
.vacio b{display:block;color:var(--txt);font-size:1.05rem;margin-bottom:4px}
.admin-row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.admin-row h3{font-size:1rem;display:flex;gap:6px;align-items:center}
.admin-row .meta{color:var(--mute);font-size:.82rem;margin:2px 0 8px}
.admin-row .acciones{margin-top:0;gap:6px}
.admin-row .acciones .btn{flex:0 0 auto}

/* Pestañas superiores */
.tabs{position:sticky;top:0;z-index:30;background:rgba(11,32,20,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -0px}
.tabs .in{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{border:0;background:none;padding:8px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--mute);font-size:.72rem;font-weight:800;border-bottom:3px solid transparent}
.tabs button span{font-size:1.15rem;line-height:1.2;filter:grayscale(.6);opacity:.8}
.tabs button[aria-current="page"]{color:var(--oro2);border-bottom-color:var(--oro)}
.tabs button[aria-current="page"] span{filter:none;opacity:1}
.fab{bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.btn.grande{padding:16px;font-size:1.05rem;border-radius:14px;margin-top:12px}
.yo-fila{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px}

.ver-mas{display:block;width:100%;margin-top:8px;background:none;border:1px dashed var(--line);border-radius:12px;padding:10px;color:var(--oro2);font-weight:800}
/* Tabla PJ/PG */
.tabla-cab,.pos-row{grid-template-columns:26px minmax(0,1fr) 28px 30px 34px}
.tabla.ind .tabla-cab,.tabla.ind .pos-row{grid-template-columns:24px minmax(0,1fr) 26px 26px 32px 40px}
.tabla-cab{display:grid;gap:8px;padding:0 10px 2px;font-size:.72rem;font-weight:800;color:var(--mute)}
.tabla-cab span:nth-child(n+3){text-align:center}
.num{text-align:center;font-weight:700;color:var(--mute);font-size:1rem}

.num.prom{font-family:var(--serif);font-weight:800;font-size:1.05rem;color:var(--oro2)}

/* Árbol de eliminatoria */
.arbol{display:flex;gap:14px;margin-top:4px}
.arbol .col{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.arbol h4{margin:0 0 6px;height:18px;font-size:.72rem;font-weight:800;color:var(--oro2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.par{flex:1;display:flex;flex-direction:column;position:relative}

.celda{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:0;text-align:left;overflow:hidden;display:block}

.num.dj{font-weight:800;font-size:.95rem}

.e-corr{background:rgba(231,185,79,.18);color:var(--oro2)}
.aviso-org{display:flex;gap:10px;align-items:flex-start;background:rgba(231,185,79,.10);border:1px solid rgba(231,185,79,.35);border-radius:12px;padding:10px 12px;font-size:.88rem;color:#F1E3BE;margin-bottom:10px}
.aviso-org b{color:#fff}
.ayuda-org{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.88rem;color:#CFE0D5}
.ayuda-org>b{color:var(--oro2)}
.ayuda-org ul{margin:6px 0 0;padding-left:18px}
.ayuda-org li{margin:4px 0}
.ayuda-org li b{color:var(--txt)}
details.res-grupo{margin-top:8px}
details.res-grupo summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;font-weight:800;font-size:.9rem;color:var(--oro2)}
details.res-grupo summary::-webkit-details-marker{display:none}
details.res-grupo summary::after{content:'▾';margin-left:auto}
details.res-grupo[open] summary::after{content:'▴'}

details.res-grupo *,details.res-grupo *::before,details.res-grupo *::after{box-sizing:border-box}

/* Selector de pareja */
.picker{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin-bottom:12px}
.pick-main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left;width:100%}

.pick-main .pn small{color:var(--oro2);font-weight:800;font-size:.72rem}
.pick-main .pn b{font-size:1.02rem}
.pick-ico{width:44px;height:44px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:1.3rem}

/* Partidas de una pareja */
.resumen-p{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;margin-bottom:12px}

.wo-box b{display:block;font-size:.92rem}.wo-box small{display:block;color:var(--mute);font-size:.8rem;margin:4px 0 8px}

<body>

<script>
/* ================= Utilidades ================= */
const $=id=>document.getElementById(id);
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const aF=s=>new Date(s+'T12:00:00');
const hoy=()=>iso(new Date());
function sumar(s,n){const d=aF(s);d.setDate(d.getDate()+n);return iso(d)}
const dias=(a,b)=>Math.round((aF(b)-aF(a))/864e5);
function fmt(s){if(!s)return'';const d=aF(s);return d.getDate()+' '+MESES[d.getMonth()].slice(0,3)}
function fmtL(s){if(!s)return'';const d=aF(s);return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]}
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
function uid(n=6){return Math.random().toString(36).slice(2,2+n)}
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
function barajar(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function slug(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'campeonato'}
const pot2=n=>{let p=1;while(p<n)p*=2;return p};
const pct=x=>Math.round(x*100)+'%';
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2300)}
const LETRAS='ABCDEFGH';
const nombreRonda=n=>({2:'Final',4:'Semifinales',8:'Cuartos de final',16:'Octavos de final',32:'Dieciseisavos',64:'Treintaidosavos'}[n]||'Ronda de '+n);
const nombreCruce=n=>({2:'Final',4:'Semifinal',8:'Cuartos',16:'Octavos',32:'Dieciseisavos',64:'Ronda'}[n]||'Ronda');

/* ================= Generación ================= */
function roundRobin(ids){
  const a=ids.slice();if(a.length%2)a.push(null);const n=a.length,rs=[];let arr=a;
  for(let r=0;r<n-1;r++){const ms=[];let resto=null;
    for(let i=0;i<n/2;i++){let x=arr[i],y=arr[n-1-i];if(i===0&&r%2)[x,y]=[y,x];if(x===null||y===null){resto=x??y;continue}ms.push([x,y])}
    rs.push({ms,resto});arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}
  return rs;
}
function tamanos(n,G){const t=Array(G).fill(Math.floor(n/G));for(let i=0;i<n%G;i++)t[i]++;return t}
function opcionesPasan(G,minT){const o=[];[1,2,4,8].forEach(k=>{const N=G*k;if(k<=minT&&N>=2&&(N&(N-1))===0)o.push(k)});return o}
function maxGrupos(n){return Math.max(1,Math.min(8,Math.floor(n/3)))}
function generar(c){
  const m=c.meta,ids=c.part.map(p=>p.id),ord=c.ordenFijo?c.ordenFijo.slice():barajar(ids);delete c.ordenFijo;
  c.partidos=[];c.descansos={};c.grupos=[];c.orden=ord;c.jornadas=[];c.res=c.res||{};
  if(m.modalidad==='individual')return c;
  const addRR=(lista,g,vueltas)=>{const rs=roundRobin(lista),R=rs.length;
    for(let v=0;v<vueltas;v++)rs.forEach((rd,r)=>{const ronda=v*R+r+1;
      rd.ms.forEach(([a,b],i)=>c.partidos.push({id:(g||'L')+ronda+'-'+(i+1),grupo:g,ronda,a:v%2?b:a,b:v%2?a:b}));
      if(rd.resto)(c.descansos[ronda]=c.descansos[ronda]||[]).push(rd.resto)})};
  if(m.formato==='liga'){c.grupos=[{nombre:'',ids:ord}];if(m.libre)return c;addRR(ord,'',m.vueltas||1)}
  if(m.formato==='grupos'){const G=m.grupos;c.grupos=Array.from({length:G},(_,i)=>({nombre:LETRAS[i],ids:[]}));
    ord.forEach((id,i)=>{const f=Math.floor(i/G),col=f%2?G-1-(i%G):i%G;c.grupos[col].ids.push(id)});
    c.grupos.forEach(g=>addRR(g.ids,g.nombre,1))}
  return c;
}

/* ================= Campeonato activo ================= */
let K=null;
function con(c,fn){const p=K;K=c;try{return fn()}finally{K=p}}
const esInd=()=>K.meta.modalidad==='individual';
const esLibre=()=>!esInd()&&!!K.meta.libre;
const porDias=()=>esInd()||esLibre();
const koV=()=>K.meta.koVueltas||1;
function finCamp(){const c=K.meta.cal;return c.tipo==='dia'?c.inicio:c.tipo==='dias'?sumar(c.inicio,c.ndias-1):c.tipo==='libre'?c.fin:null}
const plazoMs=()=>(K.meta.plazoH||48)*3600e3;
function estRes(r){if(!r)return null;if(r.disputa)return'revision';if(r.reclamo){if(r.reclamo.validado)return'ok';if(r.reclamo.rechazo)return'rechazada';return'reclamada'}return'ok'}
function RV(id){const r=K.res[id];return estRes(r)==='ok'?r:null}
const finPlazo=r=>new Date((r.reclamo?r.reclamo.ts:r.ts)+plazoMs());
const fmtHora=d=>d.toLocaleString('es-ES',{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});
function avisosAbiertos(){return todos().filter(m=>{const e=estRes(K.res[m.id]);return e&&e!=='ok'})}
const gana=(md)=>Math.ceil((K.meta.mejorDe||md||3)/2);
const ambosMD=()=>!K.meta.mejorDe;

const P=id=>K.part.find(p=>p.id===id);

function fechaRonda(r){

function desempateGan(x,y){const l=(K.desempates||[]).filter(d=>(d.a===x&&d.b===y)||(d.a===y&&d.b===x));return l.length?l[l.length-1].gan:null}

function igualados(x,y){if(!x||!y)return false;if(desempateGan(x.id,y.id))return false;return x.prom!==undefined?(x.ok===y.ok&&x.prom===y.prom&&x.dj===y.dj&&x.pj>0):(x.pg===y.pg&&x.dj===y.dj&&x.pj>0)}
function empates(rows){const out=[];for(let i=1;i<rows.length;i++)if(igualados(rows[i-1],rows[i]))out.push([rows[i-1].id,rows[i].id]);return out}
function standings(ids,ms){
  const t={};ids.forEach(id=>t[id]={id,pj:0,pg:0,pp:0,jf:0,jc:0});
  ms.filter(m=>RV(m.id)&&t[m.a]&&t[m.b]).forEach(m=>{const r=RV(m.id),A=t[m.a],B=t[m.b];
    A.pj++;B.pj++;A.jf+=r.ga;A.jc+=r.gb;B.jf+=r.gb;B.jc+=r.ga;if(r.ga>r.gb){A.pg++;B.pp++}else{B.pg++;A.pp++}});
  return Object.values(t).map(x=>({...x,dj:x.jf-x.jc})).sort((x,y)=>y.pg-x.pg||y.dj-x.dj||dz(x,y)||nom(x.id).localeCompare(nom(y.id)));
}
const tablaGrupo=g=>standings(g.ids,K.partidos.filter(m=>m.grupo===g.nombre));
const gruposTerminados=()=>K.partidos.length>0&&K.partidos.every(m=>RV(m.id));
function ordenCuadro(n){let o=[1,2];while(o.length<n){const m=o.length*2;o=o.flatMap(s=>[s,m+1-s])}return o}
function ganador(m){if(m.a==='BYE')return m.b||null;if(m.b==='BYE')return m.a||null;
  if(m.ko&&!m.padre&&koV()===2)return m.a&&m.b?globalCruce(m).gan:null;
  const r=RV(m.id);return r&&m.a&&m.b?(r.ga>r.gb?m.a:m.b):null}
function globalCruce(c){

  if(ri){ri.ga>ri.gb?wa++:wb++;dj+=ri.ga-ri.gb}
  if(rv){rv.gb>rv.ga?wa++:wb++;dj+=rv.gb-rv.ga}
  const ambos=!!(ri&&rv),empate=ambos&&wa===wb;let gan=null;
  if(ambos){if(wa!==wb)gan=wa>wb?c.a:c.b;else if(rd)gan=rd.ga>rd.gb?c.a:c.b}
  if(rd){rd.ga>rd.gb?wa++:wb++}

}
function subPartidas(c){

  const L=[{...b,id:c.id+'i',a:c.a,b:c.b,sub:'ida'},{...b,id:c.id+'v',a:c.b,b:c.a,sub:'vuelta'}];

const jugable=m=>m.a&&m.b&&m.a!=='BYE'&&m.b!=='BYE';
function cuadro(){
  const N=tamCuadro();if(N<2)return[];
  let seeds=[],labels=[];
  if(K.meta.formato==='ko'){seeds=[...K.orden,...Array(N-K.orden.length).fill('BYE')];labels=seeds.map((_,i)=>'Puesto '+(i+1)+' del sorteo')}
  else{const listo=gruposTerminados(),tablas=listo?K.grupos.map(tablaGrupo):null;
    for(let p=0;p<K.meta.pasan;p++)K.grupos.forEach((g,gi)=>{seeds.push(listo?tablas[gi][p].id:null);labels.push((p+1)+'.º del grupo '+g.nombre)})}
  const ord=ordenCuadro(N),rg=rondasGrupo(),rondas=[];
  let cur=[];for(let i=0;i<N/2;i++){const sa=ord[2*i]-1,sb=ord[2*i+1]-1;cur.push({id:'ko'+N+'-'+(i+1),ko:N,n:i+1,a:seeds[sa],b:seeds[sb],la:labels[sa],lb:labels[sb],fecha:fechaRonda(rg+1)})}
  rondas.push(cur);let size=N/2,k=1;
  while(size>=2){k++;const nx=[];
    for(let i=0;i<size/2;i++){const m1=cur[2*i],m2=cur[2*i+1];
      nx.push({id:'ko'+size+'-'+(i+1),ko:size,n:i+1,a:ganador(m1),b:ganador(m2),la:'Ganador '+nombreCruce(size*2).toLowerCase()+' '+m1.n,lb:'Ganador '+nombreCruce(size*2).toLowerCase()+' '+m2.n,fecha:fechaRonda(rg+k)})}
    rondas.push(nx);cur=nx;size/=2}
  return rondas;
}
function mesas(){let n=0;return (K.jornadas||[]).flatMap((j,ji)=>j.mesas.map((m,i)=>({...m,fecha:j.fecha,dia:ji+1,mesa:i+1,num:++n})))}
function numPartida(m){if(!K._num||K._numLen!==K.partidos.length){K._num={};K.partidos.slice().sort((a,b)=>a.ronda-b.ronda||(a.grupo||'').localeCompare(b.grupo||'')).forEach((x,i)=>K._num[x.id]=i+1);K._numLen=K.partidos.length}return K._num[m.id]}
function todos(){

function lado(m,id){if(Array.isArray(m.a))return m.a.includes(id)?'a':m.b.includes(id)?'b':null;return m.a===id?'a':m.b===id?'b':null}

function racha(h){if(!h.length)return{t:'',n:0};const u=h[h.length-1].v;let n=0;for(let i=h.length-1;i>=0&&h[i].v===u;i--)n++;return{t:u?'V':'D',n}}
function mejorRacha(h){let b=0,c=0;h.forEach(x=>{c=x.v?c+1:0;b=Math.max(b,c)});return b}
function tablaInd(){

  mesas().filter(m=>RV(m.id)).forEach(m=>{const r=RV(m.id);
    m.a.forEach(x=>{const o=t[x];o.pj++;o.jf+=r.ga;o.jc+=r.gb;r.ga>r.gb?o.pg++:o.pp++});
    m.b.forEach(x=>{const o=t[x];o.pj++;o.jf+=r.gb;o.jc+=r.ga;r.gb>r.ga?o.pg++:o.pp++})});
  const max=Math.max(0,...Object.values(t).map(x=>x.pj)),min=Math.ceil(max*(K.meta.minPct||0)/100);
  const rows=Object.values(t).map(x=>({...x,dj:x.jf-x.jc,prom:x.pj?x.pg/x.pj:0,ok:x.pj>0&&x.pj>=min}));
  rows.sort((x,y)=>(y.ok-x.ok)||y.prom-x.prom||y.dj-x.dj||dz(x,y)||nom(x.id).localeCompare(nom(y.id)));

}
function clasificacionGeneral(){

function terminado(){
  if(K.cerrado)return true;

function estado(m){
  const r=K.res[m.id];if(r){const e=estRes(r);if(e==='revision')return{c:'tarde',t:'⚠️ En revisión'};if(e==='reclamada')return{c:'proxima',t:'🚫 No presentado, por decidir'};if(e==='rechazada')return{c:'tarde',t:'🚫 En disputa'};return r.wo?{c:'tarde',t:'No presentado'}:{c:'jugada',t:'Jugada'}}

function reglasPorDefecto(m,n){
  const W=Math.ceil((m.mejorDe||3)/2),ind=m.modalidad==='individual',quien=ind?'equipo':'pareja';
  const R=[];
  const jg=m.juego||{real:true,perete:false,deje:false};
  R.push({i:'👑',t:jg.real?'Se juega con la real':'Se juega sin la real',x:jg.real?'La 31 real (tres sietes y una figura) es el mejor juego: gana a cualquier otra 31.':'La 31 formada por tres sietes y una figura vale como una 31 normal.',juego:true});
  R.push({i:'🙅',t:jg.perete?'Se juega con perete':'Se juega sin perete',x:jg.perete?'Quien reciba de primeras un 4, 5, 6 y 7 (el perete) tiene derecho a descarte y se apunta una piedra.':'La jugada 4, 5, 6 y 7 (el perete) no tiene ningún premio: se juega como cualquier otra mano.',juego:true});
  R.push({i:'✋',t:jg.deje?'Se juega con deje':'Se juega sin deje',x:jg.deje?'Se permite el deje.':'No se permite el deje.',juego:true});
  R.push({i:'🃏',t:'Cada partida',x:m.mejorDe?`Se juega al mejor de ${m.mejorDe} juegos: gana la primera ${quien} que llegue a ${W}. Los juegos se disputan con las reglas habituales de mus.`:`Cada partida puede jugarse al mejor de 3 o al mejor de 5 juegos; se indica al registrarla. Todas cuentan igual: una partida ganada o perdida, y sus juegos a favor y en contra.`});
  if(ind){
    R.push({i:'🎲',t:'Parejas por sorteo',x:'Las parejas de cada partida se sortean en el lugar de juego entre los presentes, como se acuerde allí. En la app solo se registra quién ha jugado con quién y el resultado.'});
    R.push({i:'📈',t:'Clasificación',x:`Manda el promedio de victorias: partidas ganadas entre partidas jugadas.${m.minPct?` Para entrar en la clasificación hay que haber jugado al menos el ${m.minPct} % de las partidas de quien más haya jugado.`:''}`});
    R.push({i:'⚖️',t:'Desempates',x:'Si dos jugadores tienen el mismo promedio, va delante el de mejor diferencia de juegos (juegos ganados menos juegos perdidos). Si también coinciden, se juega una partida de desempate y el ganador queda por delante.'});
  }else{
    if(m.formato==='liga')R.push({i:'📋',t:'Formato',x:m.libre?'Liga de partidas libres: las parejas juegan entre sí tantas partidas como quieran mientras el campeonato esté abierto, y cada una se registra en la app. Al cierre gana la pareja con más partidas ganadas.':'Liga todos contra todos a una vuelta. Gana el campeonato la pareja con más partidas ganadas.'});
    if(m.formato==='grupos')R.push({i:'🗂️',t:'Formato',x:`Fase de grupos todos contra todos${m.grupos>1?` en ${m.grupos} grupos sorteados`:''}. ${m.pasan?`Pasan ${m.pasan} por grupo a ${nombreRonda(m.grupos*m.pasan).toLowerCase()}, y desde ahí eliminatoria directa.`:'No hay eliminatoria.'}`});
    if(m.formato==='ko')R.push({i:'⚔️',t:'Formato',x:`Eliminatoria directa: quien pierde, queda fuera. El cuadro se sortea al crear el campeonato.${pot2(n)>n?` Como no es un cuadro completo, ${pot2(n)-n} ${pot2(n)-n>1?'parejas pasan':'pareja pasa'} la primera ronda sin jugar.`:''}`});
    if((m.formato==='ko'||(m.formato==='grupos'&&m.pasan))&&(m.koVueltas||1)===2)R.push({i:'🔁',t:'Cruces a ida y vuelta',x:'Cada cruce de la eliminatoria se juega a ida y vuelta. Pasa la pareja que gane más partidas. Si ganan una cada una, se juega una partida de desempate.'});
    if(m.formato!=='ko')R.push({i:'🏆',t:'Clasificación',x:'Manda el número de partidas ganadas. Si dos parejas empatan, va delante la de mejor diferencia de juegos (juegos ganados menos juegos perdidos). Si también coinciden, se juega una partida de desempate entre ellas y la ganadora queda por delante.'});
  }
  const c=m.cal;
  if(c.tipo!=='sin')R.push({i:'📅',t:'Calendario',x:c.tipo==='dia'?'Todo el campeonato se juega en un solo día.':c.tipo==='dias'?`El campeonato se juega en ${c.ndias} días.`:'Se juega cuando se queda.'});
  else if(!m.libre)R.push({i:'📅',t:'Cuándo se juega',x:'No hay fechas fijas: cada partida se juega cuando las dos parejas quedan, y se apunta en la app al terminar. La app muestra siempre cuáles son las siguientes partidas.'});
  if(ind||m.libre)R.push({i:'🏁',t:'Cierre',x:'Se registran todas las partidas que se jueguen. Cuando el organizador cierra el campeonato, gana quien vaya primero en la clasificación.'});
  R.push({i:'📍',t:'Lugar',x:'El lugar es libre y lo acuerdan los jugadores de cada partida.'});
  R.push({i:'✍️',t:'Registro de resultados',x:'Al terminar, cualquiera de los jugadores registra el resultado en la app. Una vez guardado, desde la cuenta de jugador ya no se puede cambiar.'});
  R.push({i:'⚠️',t:'Si un resultado está mal',x:'Abre la partida, pulsa «Impugnar resultado», marca el resultado correcto y explica el motivo. Mientras se revisa no cuenta, y decide el organizador: aceptar el resultado propuesto, mantener el registrado o poner otro.'});
  return R.map(r=>({id:uid(),...r,propia:false}));
}

const iconoFormato=c=>c.meta.modalidad==='individual'?'🎲':c.meta.libre?'🃏':{liga:'📋',grupos:'🗂️',ko:'⚔️'}[c.meta.formato];
function textoCal(m){const c=m.cal;return c.tipo==='dia'?'Un día':c.tipo==='dias'?c.ndias+' días':c.tipo==='jornadas'?'Jornada a jornada':'Temporada libre'}

/* ================= Hoja inferior ================= */
function abrirHoja(html){$('sheetIn').innerHTML='<div class="asa"></div>'+html;const d=$('sheet');if(!d.open)d.showModal()}
function cerrarHoja(){const d=$('sheet');if(d.open)d.close()}
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))cerrarHoja()});

/* ================= Render raíz ================= */
function pinta(top,main,extra=''){$('app').innerHTML=top+`<main>${main}</main>`+extra;$('app').classList.toggle('sin-nav',!/class="nav"|pie-asist/.test(extra))}
function render(){({portal:vPortal,crear:vCrear,exito:vExito,admin:vAdmin,camp:vCamp,ayuda:vAyuda,sorteo:typeof vSorteo==='function'?vSorteo:vPortal})[S.vista]()}

/* ================= Portal ================= */
function tarjetaCamp(c,admin){
  return con(c,()=>{const p=progreso(),fin=terminado(),n=c.part.length,ind=esInd();
    const est=fin?'🏆 Terminado':esInd()?'En juego':p>0?'En juego':'Por empezar';
    return `<button class="camp" data-acc="abrir" data-id="${c.id}"><span class="ico">${iconoFormato(c)}</span>
      <span style="min-width:0"><h3>${esc(c.meta.nombre)}</h3><span class="meta">${n} ${ind?'jugadores':'parejas'}, ${resumenTexto().toLowerCase()}</span>
      <span class="barra"><i style="width:${Math.round(p*100)}%"></i></span><span class="meta">${est}</span></span>
      <span class="candado">${accesoOK(c.id)?'🔓':'🔒'}</span></button>`});
}
function vPortal(){
  K=null;const lista=Object.values(DB.camps).filter(c=>!c.oculto).sort((a,b)=>b.creado-a.creado);
  pinta(`<div class="top hero"><div class="logo">🏆</div><h1>Creador de Campeonatos de Mus</h1><p>Monta tu campeonato en un minuto y comparte el enlace con los jugadores.</p></div>`,
  `<div class="banner">Demo con datos inventados. Claves de los campeonatos de ejemplo: acceso <b>1234</b>, organizador <b>9999</b>, administrador <b>admin</b>.</div>
   <div class="dos"><button class="btn" data-acc="crear">＋ Crear campeonato</button><button class="btn sec" data-acc="ayuda">📖 Instrucciones</button></div>
   <h2 class="sec">Campeonatos <span class="chip">${lista.length}</span></h2>
   ${lista.map(c=>tarjetaCamp(c)).join('')||vacio('Aún no hay campeonatos','Crea el primero.')}
   <div class="acciones" style="justify-content:center;margin-top:22px"><button class="btn sec peq" data-acc="adminLogin">🛡️ Administración</button></div>`);
}

/* ================= Acceso ================= */
function vLock(c){
  pinta(`<div class="top"><div class="top-barra"><span></span></div></div>`,
  `<div class="lock"><div class="ic">🔒</div><h2>${esc(c.meta.nombre)}</h2><p class="nota">Este campeonato es privado. Introduce la clave de acceso que te ha pasado el organizador.</p>
   <form onsubmit="return false"><input id="lockKey" type="password" inputmode="text" autocomplete="off" placeholder="Clave" aria-label="Clave de acceso">
   <label class="recordar"><input type="checkbox" id="lockRec" checked> Recordar en este dispositivo</label>
   <button class="btn full" data-acc="entrar">Entrar</button><p class="error" id="lockErr"></p></form></div>`);
  setTimeout(()=>$('lockKey')&&$('lockKey').focus(),50);
}

/* ================= Vista de campeonato ================= */
const TABS=()=>[['inicio','🏠','Inicio'],['partidas','🃏','Partidas'],['tabla','🏆',K.meta.formato==='ko'&&!esInd()?'Cuadro':'Tabla'],['estad','📊','Estadísticas'],['reglas','📜','Reglas']];
function vCamp(){
  K=DB.camps[S.id];if(!K){S.vista='portal';return render()}
  if(!accesoOK(S.id))return vLock(K);
  S.yo=ls('cdc-yo-'+S.id)||'';if(S.yo&&!P(S.yo))S.yo='';
  const m=K.meta,n=K.part.length;
  const est=terminado()?'<span class="cb est-fin">🏆 Terminado</span>':jugadas().length?'<span class="cb est-on">● En juego</span>':'<span class="cb">Por empezar</span>';
  const top=`<div class="top camp-top"><div class="top-barra">${S.admin?'<button class="icono-btn" data-acc="volverAdmin" aria-label="Administración">🛡️</button>':'<span></span>'}
    <div class="fila-flex"><button class="icono-btn" data-acc="compartir" aria-label="Compartir">📤</button><button class="org-pill ${S.org||S.admin?'on':''}" data-acc="org" aria-label="Modo organizador">🔑<span>${S.org||S.admin?'Organizador ✓':'Organizador'}</span></button></div></div>
    <div class="camp-hero"><span class="emb">${iconoFormato(K)}</span><h1 class="titulo">${esc(m.nombre)}</h1>
    <p class="meta-linea">${resumenTexto()}<i>·</i>${n} ${esInd()?'jugadores':'parejas'}<i>·</i>${txtMD(m).replace('Mejor','Al mejor')}</p>
    <div class="cbs">${est}${K.bloqueado?'<span class="cb est-off">⛔ Registro cerrado</span>':''}${(K.reglas||[]).some(r=>r.apuesta)?'<span class="cb est-ap">💶 Con apuesta</span>':''}</div></div></div>
    <nav class="tabs"><div class="in">${TABS().map(([k,i,t])=>`<button data-acc="tab" data-t="${k}" ${k===S.tab?'aria-current="page"':''}><span>${i}</span>${t}</button>`).join('')}</div></nav>`;
  const cuerpo={inicio:tInicio,tabla:tTabla,partidas:tPartidas,estad:tEstad,reglas:tReglas}[S.tab]();
  let fab='';
  if((S.tab==='partidas'||S.tab==='inicio')&&!terminado()&&(!K.bloqueado||S.org||S.admin)){
    if(porDias())fab=`<button class="fab" data-acc="regInd">＋ Registrar partida</button>`;
    else if(pendientes().length)fab=`<button class="fab" data-acc="elegir">＋ Registrar resultado</button>`;
  }
  pinta(top,cuerpo,fab);
}
function grupoDe(id){return K.meta.formato==='grupos'&&!esInd()?K.grupos.find(g=>g.ids.includes(id)):null}
function posDe(id){const g=grupoDe(id);const t=g?tablaGrupo(g):clasificacionGeneral();return t.findIndex(r=>r.id===id)}
const txtPos=id=>{const p=posDe(id),g=grupoDe(id);return p>=0?(p+1)+'.º'+(g&&K.grupos.length>1?' del grupo '+g.nombre:''):''};
function enJuego(){return pendientes().sort((a,b)=>(a.ko?1e4+(64-a.ko)*100+a.n:numPartida(a))-(b.ko?1e4+(64-b.ko)*100+b.n:numPartida(b)))}

/* ---- Inicio: podio y clasificación ---- */
function podioRows(){
  const cp=campeon();
  if(cp&&tamCuadro()){const rd=cuadro(),fin=rd[rd.length-1][0],seg=fin.a===cp?fin.b:fin.a,gen=clasificacionGeneral();
    let ter=null;if(rd.length>1){const sl=rd[rd.length-2].map(m=>ganador(m)===m.a?m.b:m.a).filter(x=>x&&x!=='BYE');ter=sl.sort((x,y)=>gen.findIndex(r=>r.id===x)-gen.findIndex(r=>r.id===y))[0]}
    const f=id=>gen.find(r=>r.id===id)||{id,pg:0,pj:0,dj:0};return[f(cp),f(seg),...(ter?[f(ter)]:[])]}
  return clasificacionGeneral().filter(r=>r.pj&&(!esInd()||r.ok));
}
const signo=n=>(n>0?'+':'')+n;
function selector(){
  const p=S.yo&&P(S.yo),q=esInd()?'jugador':'pareja';
  return `<div class="picker ${p?'on':''}"><button class="pick-main" data-acc="pick">${p?avsDe(S.yo,'g'):'<span class="pick-ico">👥</span>'}<span class="pn"><small>${p?(txtPos(S.yo)||'Seleccionada'):'Filtrar por '+q}</small><b>${p?esc(nom(S.yo)):(esInd()?'Todos los jugadores':'Todas las parejas')}</b></span><span class="pick-cambiar">${p?'Cambiar':'Elegir'} ▾</span></button>${p?`<button class="pick-x" data-acc="pickNo" aria-label="Quitar selección">✕</button>`:''}</div>`;
}
function hojaPicker(t='yo'){
  const ops=[...K.part].sort((a,b)=>nom(a.id).localeCompare(nom(b.id)));
  const cur=S[t];abrirHoja(`<h3 class="st">${t==='yo'?(esInd()?'Elige jugador':'Elige pareja'):'Elige con quién comparar'}</h3><p class="sub">Toca para seleccionar.</p>
   <div class="pick-grid">${t==='yo'?`<button class="tile ${!S.yo?'sel':''}" data-acc="pickSel" data-t="yo" data-id="" data-n="todas todos"><span class="pick-ico">👥</span><b>${esInd()?'Todos':'Todas'}</b></button>`:''}${ops.map(p=>`<button class="tile ${p.id===cur?'sel':''}" data-acc="pickSel" data-t="${t}" data-id="${p.id}" data-n="${esc((nom(p.id)+' '+p.j1+' '+p.j2).toLowerCase())}">${avsDe(p.id,'g')}<b>${esc(nom(p.id))}</b>${p.apodo?`<small>${esc(p.j1)} y ${esc(p.j2)}</small>`:''}</button>`).join('')}</div>`);
}
function yoFila(){const ops=[...K.part].sort((a,b)=>nom(a.id).localeCompare(nom(b.id)));
  return `<div class="yo-fila"><span>${esInd()?'Soy':'Mi pareja'}</span><select id="selYo" aria-label="Elegir participante"><option value="">${esInd()?'Elige quién eres':'Elige tu pareja'}</option>${ops.map(p=>`<option value="${p.id}" ${p.id===S.yo?'selected':''}>${esc(nom(p.id))}</option>`).join('')}</select></div>`}
function leyenda(){
  const pasos=esInd()?['Promedio de victorias (ganadas entre jugadas).','Si hay empate, diferencia de juegos.','Si siguen igualados, partida de desempate.']:['Partidas ganadas.','Si hay empate, diferencia de juegos (ganados menos perdidos).','Si siguen igualadas, partida de desempate.'];
  return `<details class="leyenda-mini"><summary>ℹ️ ¿Cómo se ordena? <span>PJ jugadas · PG ganadas · DJ dif. de juegos</span></summary><ol>${pasos.map(p=>`<li>${p}</li>`).join('')}</ol></details>`;
}

function clasifCompleta(){
  const m=K.meta;
  const fin=terminado()||(m.formato==='liga'&&!esLibre()&&!esInd()&&gruposTerminados());
  if(esInd())return tablaHTML(tablaInd().rows,{completa:fin});
  if(m.formato==='liga')return tablaHTML(standings(K.part.map(p=>p.id),esLibre()?mesas():K.partidos),{completa:fin});
  let h='';K.grupos.forEach(g=>{const ok=K.partidos.filter(x=>x.grupo===g.nombre).every(x=>RV(x.id));h+=(K.grupos.length>1?`<div class="grupo-cab"><span class="letra">${g.nombre}</span>Grupo ${g.nombre}</div>`:'')+tablaHTML(tablaGrupo(g),{pasa:m.pasan,completa:ok})});

  return h;
}
function resultadosGrupo(g){
  const ms=K.partidos.filter(m=>m.grupo===g.nombre),jug=ms.filter(m=>K.res[m.id]).sort((a,b)=>a.ronda-b.ronda);
  return `<details class="res-grupo"><summary>📋 Resultados ${K.grupos.length>1?'del grupo '+g.nombre:'de la liguilla'} <span class="chip">${jug.length} de ${ms.length}</span></summary><div class="lista">${jug.length?jug.map(matchHTML).join(''):'<p class="nota">Aún no hay resultados.</p>'}</div></details>`;
}
function casoHTML(m){
  const r=K.res[m.id],e=estRes(r),ind=Array.isArray(m.a),org=S.org||S.admin;
  const tit={revision:'⚠️ Resultado impugnado',reclamada:'🚫 No se ha presentado: '+nom(m[r.wo]),rechazada:'🚫 En disputa: ¿se presentó '+nom(m[r.wo])+'?'}[e]+((r.disputa&&r.disputa.espera)||(r.reclamo&&r.reclamo.espera)?' ⏸️':'');
  let cuerpo='';
  if(e==='revision')cuerpo=`<p><b>${esc(r.disputa.por||'Alguien')}</b> dice que no es correcto${r.disputa.prop?` y propone <b>${r.disputa.prop.ga}–${r.disputa.prop.gb}</b>`:''}:</p><q>${esc(r.disputa.motivo)}</q><p class="pie">${r.disputa.espera?'⏸️ El organizador lo ha dejado pendiente de decidir.':'Mientras se revisa, esta partida no cuenta.'}</p>`;
  if(e==='reclamada')cuerpo=`<p><b>${esc(r.reclamo.por||nom(m[r.wo==='a'?'b':'a']))}</b> dice que <b>${esc(nom(m[r.wo]))}</b> no se presentó:</p><q>${esc(r.reclamo.motivo)}</q><p class="pie">${r.reclamo.espera?'⏸️ El organizador lo ha dejado pendiente de decidir.':'Pendiente de que decida el organizador. La pareja señalada puede decir que no es cierto.'}</p>`;
  if(e==='rechazada')cuerpo=`<p><b>${esc(r.reclamo.por||'Una pareja')}</b> dice que <b>${esc(nom(m[r.wo]))}</b> no se presentó:</p><q>${esc(r.reclamo.motivo)}</q><p><b>${esc(r.reclamo.rechazo.por||'La otra pareja')}</b> dice que no es cierto:</p><q>${esc(r.reclamo.rechazo.motivo)}</q><p class="pie">${r.reclamo.espera?'⏸️ El organizador lo ha dejado pendiente de decidir.':'Tiene que decidir el organizador.'}</p>`;
  return `<div class="caso c-${e}"><div class="caso-cab"><b>${tit}</b><small>${etiqueta(m)}</small></div>
    <div class="match" style="pointer-events:none;margin:8px 0">${ind?ptInd(m.a):pt(m.a)}<span class="centro"><span class="res" style="opacity:.7">${r.ga}–${r.gb}</span></span>${ind?ptInd(m.b,{der:1}):pt(m.b,{der:1})}</div>
    <div class="caso-txt">${cuerpo}</div>
    <div class="acciones">${e==='reclamada'&&!org?`<button class="btn sec peq" data-acc="resultado" data-id="${m.id}">Ver o rechazar</button>`:`<button class="btn sec peq" data-acc="resultado" data-id="${m.id}">Ver detalle</button>`}<button class="btn peq" data-acc="resolver" data-id="${m.id}">${org?'✅ Resolver':'🔑 Resolver (organizador)'}</button></div></div>`;
}
function avisosHTML(){const av=avisosAbiertos();if(!av.length)return'';
  return `<button class="pill-avisos" data-acc="verCasos"><span>⚖️ Reclamaciones e impugnaciones</span><span class="pill-n">${av.length}</span><span class="pill-ver">Ver ›</span></button>`}
function hojaCasos(){const av=avisosAbiertos();if(!av.length){cerrarHoja();return}
  abrirHoja(`<h3 class="st">⚖️ Reclamaciones e impugnaciones</h3><p class="sub">Visibles para todos. Las resuelve el organizador.</p>${av.map(casoHTML).join('')}<div class="acciones"><button class="btn sec" data-acc="cerrar">Cerrar</button></div>`)}
function tInicio(){
  let h=avisosHTML();const cp=campeon(),m=K.meta;
  if(cp)h+=campeonHTML(cp);
  else if(terminado()||(m.formato==='liga'&&!porDias()&&gruposTerminados())){const t=m.formato==='grupos'&&K.grupos.length===1?tablaGrupo(K.grupos[0]):clasificacionGeneral();if(igualados(t[0],t[1]))h+=`<div class="aviso-org">⚔️ <span><b>Empate en el primer puesto</b> entre ${esc(nom(t[0].id))} y ${esc(nom(t[1].id))}. El campeón saldrá de una partida de desempate: regístrala desde la clasificación.</span></div>`}
  if(false&&porJornadas()&&!gruposTerminados()){const ja=jornadaActual(),tot=rondasGrupo(),ms=K.partidos.filter(x=>x.ronda===ja),hechas=ms.filter(x=>K.res[x.id]).length;
    h+=`<div class="jornada-box"><div class="jb-top"><span class="jb-n">${ja}</span><span><b>Jornada ${ja} de ${tot} en juego</b><small>${ms.length-hechas?`Faltan ${ms.length-hechas} ${ms.length-hechas>1?'partidas':'partida'} para abrir ${ja<tot?'la jornada '+(ja+1):'la fase final'}`:'Completa'}</small></span></div>
    <div class="barra-vic" style="background:var(--card2)"><i style="width:${hechas/ms.length*100}%;background:var(--oro)"></i></div>
    <details class="como"><summary>¿Cómo funcionan las jornadas?</summary><ul><li>Se juegan <b>en orden</b>: la jornada siguiente se abre sola cuando todas las partidas de la actual tienen resultado.</li><li>Hasta entonces, las partidas de jornadas posteriores aparecen con 🔒 y no se pueden registrar.</li><li>Si una pareja no se presenta, el organizador da la partida por perdida a esa pareja y la jornada puede seguir.</li></ul></details></div>`}
  if(porDias()&&!terminado()){const f=finCamp();h+=`<div class="pill-info">🏁 ${f?'Abierto hasta el '+fmtL(f):'Abierto: lo cierra el organizador'}</div>`}
  if(!esInd()&&m.formato==='ko'){
    h+=`<h2 class="sec">⚔️ Cuadro de la eliminatoria</h2><p class="nota">Toca un cruce para registrar su resultado. El ganador pasa solo a la siguiente ronda.</p>`+arbolHTML();
  }else if(!esInd()&&m.formato==='grupos'){
    h+=`<h2 class="sec">🗂️ ${K.grupos.length>1?'Fase de grupos':'Liguilla'}</h2>`;
    K.grupos.forEach(g=>{h+=(K.grupos.length>1?`<div class="grupo-cab"><span class="letra">${g.nombre}</span>Grupo ${g.nombre}</div>`:'')+tablaHTML(tablaGrupo(g),{pasa:m.pasan})+resultadosGrupo(g)});
    h+=leyenda();
    if(m.pasan)h+=`<h2 class="sec">⚔️ Eliminatoria</h2><p class="nota">${gruposTerminados()?'Toca un cruce para registrar su resultado.':`Pasan los ${m.pasan} primeros de cada grupo (franja dorada). Los cruces se rellenan solos al terminar la fase de grupos.`}</p>`+arbolHTML();
  }else{
    const pr=podioRows();
    h+=`<h2 class="sec">🥇 Podio ${terminado()?'final':'en este momento'}</h2>`+(pr.length>=Math.min(3,K.part.length)&&pr.length>=2?`<div class="card pad">${podioHTML(pr,r=>esInd()?r.pg+' de '+r.pj:r.pg+' PG, DJ '+signo(r.dj))}</div>`:`<p class="nota">El podio aparecerá en cuanto se jueguen las primeras partidas.</p>`);
    h+=`<h2 class="sec">🏆 Clasificación</h2>`+clasifCompleta()+leyenda();
  }
  if(!terminado()){
    if(porDias()){const ult=mesas().filter(x=>K.res[x.id]).sort((a,b)=>(K.res[b.id].ts||0)-(K.res[a.id].ts||0)).slice(0,3);if(ult.length)h+=`<h2 class="sec">🃏 Últimas partidas</h2><div class="lista">${ult.map(matchHTML).join('')}</div>`}
    else{const pend=enJuego();
      if(pend.length)h+=`<h2 class="sec">▶️ Próximas partidas <span class="chip">${pend.length} por jugar</span></h2><div class="lista">${pend.slice(0,4).map((x,i)=>matchHTML(x,i===0)).join('')}</div>${pend.length>4?`<button class="ver-mas" data-acc="tab" data-t="partidas">Ver todas las partidas ›</button>`:''}`}
  }
  return h;
}

/* ---- Tabla clara: PJ, PG y DJ ---- */
function tablaHTML(rows,o={}){
  const ind=esInd(),min=ind?tablaInd().min:0;
  return `<div class="tabla ${ind?'ind':''}"><div class="tabla-cab"><span>#</span><span>${ind?'Jugador':'Pareja'}</span><span>PJ</span><span>PG</span><span>DJ</span>${ind?'<span>Prom.</span>':''}</div>`+
  rows.map((r,i)=>{const ab=S.exp===r.id;const prev=rows[i-1];const igual=igualados(prev,r);if(!igual)o._p=i+1;const pos=o._p;
    return `<button class="pos-row ${o.pasa&&i<o.pasa?'pasa':''} ${r.id===S.yo?'yo':''} ${ind&&!r.ok?'fuera':''}" data-acc="exp" data-id="${r.id}" aria-expanded="${ab}">
    <span class="pos ${pos<=3?'p'+pos:''}">${igual?'=':pos}</span>${pt(r.id)}<span class="num">${r.pj}</span><span class="num ${ind?'':'fuerte'}">${r.pg}</span><span class="num dj ${r.dj>0?'pos':r.dj<0?'neg':''}">${signo(r.dj)}</span>${ind?`<span class="num prom">${r.pj?r.prom.toFixed(2).replace('.',','):'–'}</span>`:''}
    ${ab?`<span class="detalle"><span class="mini"><b>${r.pp}</b><span>perdidas</span></span><span class="mini"><b>${r.jf}</b><span>juegos ganados</span></span><span class="mini"><b>${r.jc}</b><span>juegos perdidos</span></span><span class="mini"><span>últimas 5</span>${forma(r.id)}</span></span>`:''}</button>`}).join('')+
  `</div>${ind&&min?`<p class="nota">En gris, quien aún no llega al mínimo de ${min} ${min===1?'partida':'partidas'} para clasificar.</p>`:''}${o.completa?cajaDesempates(rows):''}`;
}
function cajaDesempates(rows){
  const em=empates(rows);if(!em.length)return'';
  const puede=!K.bloqueado||S.org||S.admin;
  return em.map(([a,b])=>`<div class="desemp"><span class="de-ic">⚔️</span><span class="de-tx"><b>Empate entre ${esc(nom(a))} y ${esc(nom(b))}</b><small>Están igualados en todo: se juega una partida de desempate.</small></span>${puede?`<button class="btn peq" data-acc="desempate" data-a="${a}" data-b="${b}">Registrar</button>`:''}</div>`).join('');
}

/* ---- Cuadro en forma de árbol ---- */
function corto(l){return l?l.replace(' del grupo ',' '):''}
function celdaHTML(m){

  adminLogin(){abrirHoja(`<h3 class="st">🛡️ Administración</h3><p class="sub">Acceso solo para el administrador de la plataforma.</p><input id="admKey" type="password" placeholder="Clave de administrador" aria-label="Clave de administrador"><p class="error" id="admErr"></p><div class="acciones"><button class="btn" data-acc="entrarAdmin">Entrar</button><button class="btn sec" data-acc="cerrar">Cancelar</button></div>`);setTimeout(()=>$('admKey').focus(),60)},

  admBorrar(el){const c=DB.camps[el.dataset.id];abrirHoja(`<h3 class="st">Eliminar campeonato</h3><p class="sub">Se borrará «${esc(c.meta.nombre)}» con todos sus resultados. No se puede deshacer.</p><div class="acciones"><button class="btn peligro" data-acc="admBorrarOk" data-id="${c.id}">Eliminar definitivamente</button><button class="btn sec" data-acc="cerrar">Cancelar</button></div>`)},

  wz(el){const k=el.dataset.k,v=el.dataset.v;WZ[k]=isNaN(+v)?v:+v;if(k==='modalidad'){WZ.formato=v==='individual'?'liga':'grupos';WZ.cal.tipo=v==='individual'?'libre':'dia';WZ.n=8}if(k==='formato'&&v!=='liga')WZ.vueltas=1;render()},

  wzQuita(el){WZ.reglas=WZ.reglas.filter(r=>r.id!==el.dataset.id);render()},

  wzAtras(){if(WZ.paso<=1)return ACC.portal();WZ.paso--;if(WZ.paso===4)WZ.paso=3;render();scrollTo(0,0)},
  wzSig(){if(!wzValidar())return;if(WZ.paso===PASOS.length-1)return crearCamp();WZ.paso++;if(WZ.paso===4)WZ.paso=5;render();scrollTo(0,0)},
};

});
document.addEventListener('change',e=>{const t=e.target;

/* ---------- Conexión: reintentos, tiempo máximo e indicador ---------- */
function sync(estado){let e=$('sync');if(!e){e=document.createElement('div');e.id='sync';document.body.appendChild(e)}
  e.className='sync '+estado;e.textContent={carga:'Conectando…',guarda:'Guardando…',ok:'✓ Guardado',error:'⚠️ Sin conexión, reintentando…'}[estado]||'';
  clearTimeout(e._t);if(estado==='ok')e._t=setTimeout(()=>e.className='sync',1500)}
async function api(action,body={},intentos=3){
  if(!SCRIPT_URL||SCRIPT_URL.startsWith('__'))throw new Error('Falta conectar el servidor.');
  let ultimo;
  for(let i=0;i<intentos;i++){
    const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
    try{
      const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...body}),signal:ctl.signal});
      const j=await r.json();clearTimeout(t);
      if(j.error){const e=new Error(j.error==='conflicto'?'Alguien ha cambiado el campeonato a la vez. Ya ves la versión actual: revisa y repite.':j.error);e.data=j;e.servidor=true;throw e}
      return j;
    }catch(e){clearTimeout(t);if(e.servidor)throw e;ultimo=e;if(i<intentos-1){sync('error');await new Promise(r=>setTimeout(r,800*(i+1)))}}
  }
  const e=new Error('No hay conexión con el servidor. Comprueba tu internet e inténtalo de nuevo.');e.red=true;throw e;
}

function guardarDB(){

  const fig={
    oros:`<circle cx="50" cy="72" r="26" fill="#F3C64E" stroke="${col}" stroke-width="4"/><circle cx="50" cy="72" r="15" fill="none" stroke="${col}" stroke-width="3"/><circle cx="50" cy="72" r="5" fill="${col}"/>`,
    copas:`<path d="M28 50h44c0 22-9 34-22 36-13-2-22-14-22-36z" fill="#E8574B" stroke="${col}" stroke-width="3"/><rect x="46" y="86" width="8" height="12" fill="${col}"/><rect x="36" y="97" width="28" height="6" rx="3" fill="${col}"/><path d="M34 56h32" stroke="#F6D36B" stroke-width="3"/>`,
    espadas:`<path d="M50 34l7 10v40h-14V44z" fill="#9CC2EE" stroke="${col}" stroke-width="3"/><rect x="34" y="84" width="32" height="6" rx="3" fill="#E7B94F" stroke="${col}" stroke-width="2"/><rect x="46" y="90" width="8" height="14" fill="${col}"/><circle cx="50" cy="107" r="5" fill="#E7B94F"/>`,
    bastos:`<path d="M44 106c-2-22 0-44 2-60 1-10 10-12 12-2 2 14 1 38-2 62z" fill="#8FCB7E" stroke="${col}" stroke-width="3"/><circle cx="49" cy="58" r="3" fill="${col}"/><circle cx="53" cy="74" r="3" fill="${col}"/><circle cx="50" cy="90" r="3" fill="${col}"/>`}[palo];
  return `<g class="carta" style="--r:${rot}deg;--d:${delay}s" transform="translate(${x} 18)"><g class="carta-in"><rect width="100" height="140" rx="10" fill="#FBF6E9" stroke="${col}" stroke-width="3"/><rect x="6" y="6" width="88" height="128" rx="7" fill="none" stroke="${col}" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 3"/>

}

    :SR.estado==='girando'?`<button class="btn cta" disabled>Sorteando…</button>`
    :ultima?`<button class="btn cta" data-acc="srCrear">✅ Crear campeonato</button>`:`<button class="btn cta" data-acc="srSig">Siguiente: ${{grupos:'sorteo de grupos',cuadro:'sorteo del cuadro'}[SR.fases[SR.f+1]]} ›</button>`;
  pinta(`<div class="top sr-top"><div class="top-barra"><button class="icono-btn" data-acc="srSalir" aria-label="Volver">‹</button><span class="paso-t">${esc(w.nombre)}</span></div>
    <div class="sr-hero"><span class="sr-dado">🎲</span><h1 class="titulo">${titulos[fase]}</h1><div class="sr-pasos">${pasos}</div></div></div>`,
    cuerpo+`<div class="sr-pie">${boton}</div>`);
}
/* Ver el sorteo dentro del campeonato */
const _tInicio=tInicio;
tInicio=function(){return(K.sorteo?`<button class="pill-sorteo" data-acc="verSorteo">🎲 Ver el sorteo</button>`:'')+_tInicio()};
ACC.verSorteo=function(){
  const s=K.sorteo;let h=`<h3 class="st">🎲 Sorteo del campeonato</h3><p class="sub">Hecho al crear el campeonato.</p>`;
  if(s.parejas)h+=`<b class="sr-sub">Parejas</b><div class="sr-lista">${K.part.map((p,i)=>`<div class="sr-item"><span class="sr-n">${i+1}</span>${avsDe(p.id)}<b>${esc(p.j1)} <span>y</span> ${esc(p.j2)}</b></div>`).join('')}</div>`;
  if(s.grupos)h+=`<b class="sr-sub">Grupos</b><div class="sr-grupos">${K.grupos.map(g=>`<div class="sr-g"><div class="sr-gc">Grupo ${g.nombre}</div>${g.ids.map(id=>`<div class="sr-item">${avsDe(id)}<b>${esc(nom(id))}</b></div>`).join('')}</div>`).join('')}</div>`;
  if(s.cuadro){const r=cuadro()[0]||[];h+=`<b class="sr-sub">Primera ronda</b><div class="sr-lista">${r.map((m,i)=>`<div class="sr-item cruce"><span class="sr-n">${i+1}</span><b>${m.a==='BYE'?'<i>pasa directa</i>':esc(nom(m.a))}</b><span class="sr-vs">VS</span><b>${m.b==='BYE'?'<i>pasa directa</i>':esc(nom(m.b))}</b></div>`).join('')}</div>`}
  abrirHoja(h+`<div class="acciones"><button class="btn sec" data-acc="cerrar">Cerrar</button></div>`);
};

cargarDB();render();
</script>
</body>
</html>
