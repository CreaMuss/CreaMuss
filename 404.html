<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CreaMus</title>
<script>
  // Convierte /nombre-del-campeonato en /?c=nombre-del-campeonato y abre la app
  var partes = location.pathname.split('/').filter(Boolean);
  var slug = partes.pop() || '';
  var base = '/' + (partes.length ? partes.join('/') + '/' : '');
  location.replace(location.origin + base + (slug ? '?c=' + encodeURIComponent(slug) : ''));
</script>
</head>
<body style="background:#10291B"></body>
</html>
